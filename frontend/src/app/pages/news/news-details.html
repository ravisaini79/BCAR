<app-header></app-header>

<!-- Skeleton Loader -->
<div class="news-details-skeleton-page" *ngIf="loading()">
  <div class="minimal-container py-5 mt-5">
    <div class="row g-4">
      <div class="col-md-4">
        <p-skeleton width="100%" height="320px" borderRadius="16px"></p-skeleton>
      </div>
      <div class="col-md-8">
        <p-skeleton width="120px" height="20px" styleClass="mb-3"></p-skeleton>
        <p-skeleton width="80%" height="40px" styleClass="mb-3"></p-skeleton>
        <div class="d-flex gap-3 mb-4">
          <p-skeleton width="100px" height="24px" borderRadius="50px"></p-skeleton>
          <p-skeleton width="120px" height="24px" borderRadius="50px"></p-skeleton>
        </div>
        <p-skeleton width="100%" height="200px" borderRadius="12px"></p-skeleton>
      </div>
    </div>
  </div>
</div>

<!-- Main Details Page -->
<article class="news-details-page" *ngIf="article() && !loading()">
  <div class="minimal-container">
    
    <!-- Top Bar with Back Button -->
    <div class="details-top-bar mb-4">
      <button class="back-to-news-btn" (click)="goBack()">
        <i class="pi pi-arrow-left"></i> Back to News
      </button>
    </div>

    <!-- Responsive Desktop 35/65 Split Layout Grid -->
    <div class="row g-4 g-lg-5 align-items-start main-details-grid">
      
      <!-- Left Column: Image Card (35% width on desktop) -->
      <div class="col-lg-4 image-column-left">
        <div class="circular-preview-card" (click)="zoomImage()" title="Click to view full screen">
          <div class="card-img-wrapper" [class.portrait-img]="article()!.featuredImage?.height > article()!.featuredImage?.width">
            <img 
              [src]="getImageUrl(article())" 
              [alt]="displayTitle()" 
              class="circular-card-img"
              (error)="onImageError($event)"
            />
            <div class="card-hover-overlay">
              <i class="pi pi-search-plus"></i>
              <span>Click to view full image</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Title and Content (65% width on desktop) -->
      <div class="col-lg-8 content-column-right">
        
        <!-- Metadata: Date and Category Badge only -->
        <div class="circular-meta-strip d-flex align-items-center gap-3 mb-3">
          <span class="meta-date">
            <i class="fa-regular fa-calendar-days me-1"></i>
            {{ article()!.publishDate | date: 'dd MMMM yyyy' }}
          </span>
          <span class="meta-badge" [class]="article()!.category">
            {{ getTag(article()!.category) }}
          </span>
        </div>

        <!-- News Title (40px bold) -->
        <h1 class="circular-main-title">{{ displayTitle() }}</h1>

        <!-- Article Content -->
        <div class="circular-rich-text portal-rich-content" [innerHTML]="cleanFullDescription()"></div>

        <!-- Single Download Circular button (Only if PDF exists) -->
        <div class="action-buttons-wrapper mt-5" *ngIf="hasPdf()">
          <button class="download-circular-btn" (click)="downloadCircular()">
            <i class="pi pi-download me-1"></i> Download Circular
          </button>
        </div>

      </div>

    </div>

  </div>
</article>

<!-- Empty State (Circular Not Found) -->
<div class="news-details-page empty-state" *ngIf="error() && !loading()">
  <div class="container py-5 text-center">
    <div class="empty-state-card card border-0 p-5 shadow-sm mx-auto mt-5" style="max-width: 500px; border-radius: 16px;">
      <i class="fa-solid fa-file-circle-xmark text-danger fs-1 mb-3"></i>
      <h3 class="fw-bold mb-2">Circular Not Found</h3>
      <p class="text-muted">The requested circular or news article is not available.</p>
      <button class="btn btn-primary rounded-pill px-4 mt-3" (click)="goBack()">
        <i class="pi pi-arrow-left me-1"></i> Return to News
      </button>
    </div>
  </div>
</div>

<!-- Image Lightbox Modal Zoom -->
<div class="bankmitra-lightbox-overlay" *ngIf="isImageZoomed()" (click)="closeZoom()">
  <button class="lightbox-close-btn" (click)="closeZoom()" aria-label="Close Preview"><i class="pi pi-times"></i></button>
  <div class="lightbox-content" (click)="$event.stopPropagation()">
    <img 
      [src]="getImageUrl(article())" 
      [alt]="displayTitle()" 
      class="lightbox-zoomed-img"
      (error)="onImageError($event)"
    />
  </div>
</div>

<app-footer></app-footer>
